name: Publicar no GitHub Pages
# Copia a pasta app/ para o ramo gh-pages, que o GitHub Pages publica.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e enviar para gh-pages
        run: |
          mkdir site && cp -R app/. site/ && touch site/.nojekyll
          sed -i "s/const CACHE = 'evoruk-v1'/const CACHE = 'evoruk-${GITHUB_SHA::8}'/" site/sw.js
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publicar ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
