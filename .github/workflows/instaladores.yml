name: Instaladores (Windows e Mac)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar:
    strategy:
      matrix:
        include:
          - os: windows-latest
            alvo: win
          - os: macos-latest
            alvo: mac
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copiar o app para o pacote
        shell: bash
        run: rm -rf app && cp -R ../app app
      - run: npm install --no-audit --no-fund
      - name: Montar instalador
        shell: bash
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm run dist:${{ matrix.alvo }}
      - uses: actions/upload-artifact@v4
        with:
          name: Evoruk-${{ matrix.alvo }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
      - name: Anexar à versão (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
