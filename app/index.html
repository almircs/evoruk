<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evoruk</title>
<meta name="description" content="Controle mensal das contas da casa: lançar, dar baixa e ver o ano inteiro.">
<meta name="theme-color" content="#0E5E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evoruk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Evoruk — layout: barra do mês no topo, conteúdo em cartões, abas embaixo no celular e na lateral no computador */
:root {
  --bg: #EDF1F3;
  --panel: #FFFFFF;
  --ink: #15212B;
  --muted: #5A6874;
  --line: #D9E0E5;
  --accent: #0E5E63;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEE;
  --danger: #B93A26;
  --pago: #FFE45C;
  --pago-ink: #3B3000;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  color-scheme: light;
}
:root[data-pago="verde"] { --pago: #A6EBB4; --pago-ink: #0F3B1B; }
:root[data-pago="azul"] { --pago: #A9D2FF; --pago-ink: #0B2A4A; }
:root[data-pago="rosa"] { --pago: #FFC0DA; --pago-ink: #4A0F27; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --panel: #172027; --ink: #E5ECF0; --muted: #94A3AF; --line: #27333C;
    --accent: #4CC2B6; --accent-ink: #062523; --accent-soft: #163B3A; --danger: #FF8D78;
    --pago: #5E5214; --pago-ink: #FFF3A6; color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-pago="verde"] { --pago: #1F5130; --pago-ink: #C9F7D3; }
  :root:not([data-theme="light"])[data-pago="azul"] { --pago: #1C3F66; --pago-ink: #D3E7FF; }
  :root:not([data-theme="light"])[data-pago="rosa"] { --pago: #5A2340; --pago-ink: #FFD6E7; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* estrutura */
.casca { min-height: 100%; display: flex; flex-direction: column; }
.topo { position: sticky; top: 0; z-index: 10; background: var(--accent); color: var(--accent-ink); padding: calc(env(safe-area-inset-top) + 8px) 16px 10px; }
.topo-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; }
.marca svg { width: 28px; height: 28px; }
.periodo { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.periodo h1 { margin: 0; font-size: 1.05rem; font-weight: 700; min-width: 9.5em; text-align: center; }
.seta { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: inherit; font-size: 1.35rem; line-height: 1; }
.corpo { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; display: flex; gap: 20px; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
.abas button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: .72rem; font-weight: 600; color: var(--muted); border-radius: 10px; }
.abas button svg { width: 24px; height: 24px; }
.abas button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 900px) {
  .abas { position: sticky; top: 76px; align-self: flex-start; flex-direction: column; display: flex; width: 190px; border: 1px solid var(--line); border-radius: var(--r); padding: 8px; gap: 4px; }
  .abas button { flex-direction: row; gap: 10px; padding: 10px 12px; font-size: .95rem; justify-content: flex-start; }
  .corpo { padding-bottom: 32px; }
}

/* blocos */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.resumo { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.resumo-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rotulo { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.grande { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.grande.ok { color: var(--accent); }
.mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini > div { display: flex; flex-direction: column; gap: 2px; }
.mini b { font-size: 1.05rem; }
.mini .pg b { background: var(--pago); color: var(--pago-ink); border-radius: 5px; padding: 0 5px; align-self: flex-start; }
.barra { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.nota { margin: 0; font-size: .85rem; color: var(--muted); }
.nota.alerta { color: var(--danger); font-weight: 600; }
.filtro { display: flex; gap: 4px; background: var(--line); padding: 3px; border-radius: 10px; align-self: flex-start; }
.filtro button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.filtro button[aria-pressed="true"] { background: var(--panel); color: var(--ink); }

.lista { overflow: hidden; }
.lista-tit { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 6px; }
.lista-tit h2 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lista-tit span { font-size: .85rem; color: var(--muted); }
.item { border-top: 1px solid var(--line); }
.linha { display: grid; grid-template-columns: 34px 1fr auto 38px; align-items: center; gap: 8px; padding: 6px 4px 6px 12px; min-height: 58px; }
.item.pago .linha { background: var(--pago); color: var(--pago-ink); }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; color: transparent; }
.check svg { width: 16px; height: 16px; }
.item.pago .check { background: var(--pago-ink); border-color: var(--pago-ink); color: var(--pago); }
.nome { border: 0; background: none; text-align: left; padding: 8px 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nome strong { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; }
.nome small { color: var(--muted); font-size: .8rem; }
.item.pago .nome small { color: inherit; opacity: .78; }
.nome small.atraso { color: var(--danger); font-weight: 700; }
.ponto { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.valor { font-weight: 700; text-align: right; white-space: nowrap; }
.edita { width: 36px; height: 36px; border: 0; background: none; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.edita svg { width: 18px; height: 18px; }
.item.pago .edita { color: inherit; }
.compras { background: var(--bg); padding: 4px 14px 10px 54px; }
.compra { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: .9rem; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.compra button, .link { border: 0; background: none; color: var(--accent); padding: 4px 6px; font-weight: 600; font-size: .88rem; }
.link { padding: 8px 0; text-align: left; }
.parc { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.vazio-lista { padding: 10px 14px 14px; margin: 0; color: var(--muted); font-size: .9rem; }

.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; font-weight: 700; min-height: 48px; }
.btn.forte { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.perigo { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.vazio { padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: stretch; }
.vazio p { margin: 0; color: var(--muted); }

@media (min-width: 900px) {

  .acoes { grid-template-columns: 1fr; }
}
.mes-grid { display: flex; flex-direction: column; gap: 14px; }
.mes-grid .principal { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mes-grid .lado { display: contents; }
.mes-grid .lado .resumo { order: -1; }
.mes-grid .lado .acoes { order: 2; }
@media (min-width: 900px) {
  .mes-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .mes-grid .lado { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 14px; }
}

/* ano */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.kpi b { font-size: 1.2rem; }
.kpi small { color: var(--muted); font-size: .8rem; }
.sobe { color: var(--danger); } .desce { color: var(--accent); }
.grafico { padding: 14px; }
.grafico svg { width: 100%; height: auto; display: block; }
.grafico text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.legenda { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabela { border-collapse: separate; border-spacing: 0; font-size: .85rem; min-width: 100%; }
.tabela th, .tabela td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
.tabela th { color: var(--muted); font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; background: var(--panel); }
.tabela .fixa { position: sticky; left: 0; background: var(--panel); text-align: left; z-index: 1; max-width: 180px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--line); }
.tabela td.p { background: var(--pago); color: var(--pago-ink); }
.tabela td.a { color: var(--danger); font-weight: 600; }
.tabela td.clica { cursor: pointer; }
.tabela tfoot td { font-weight: 800; border-bottom: 0; }
.tabela tr.sep td { background: var(--bg); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: left; font-weight: 700; }
.secao { padding: 14px 14px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.secao h2 { margin: 0; font-size: 1rem; }

/* cartões */
.cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cc { border: 2px solid transparent; text-align: left; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.cc[aria-pressed="true"] { border-color: var(--accent); }
.cc .faixa { height: 6px; border-radius: 3px; margin-bottom: 6px; }
.cc strong { font-size: 1rem; }
.cc small { color: var(--muted); font-size: .8rem; }

/* backup */
.bloco { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bloco h2 { margin: 0; font-size: 1.05rem; }
.bloco .acoes { grid-template-columns: 1fr; }
@media (min-width: 600px) { .bloco .acoes { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } }
.fatos { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: .92rem; }
.fatos dt { color: var(--muted); } .fatos dd { margin: 0; font-weight: 600; }
.cores { display: flex; gap: 10px; flex-wrap: wrap; }
.cor { border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; background: var(--panel); font-weight: 600; }
.cor i { width: 18px; height: 18px; border-radius: 5px; }
.cor[aria-pressed="true"] { border-color: var(--accent); }
textarea.saida { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: .75rem; background: var(--bg); color: var(--ink); }

/* folha (formulários) */
.fundo { position: fixed; inset: 0; background: rgba(8, 14, 20, .5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.folha { background: var(--panel); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-height: 92%; overflow-y: auto; }
@media (min-width: 700px) { .fundo { align-items: center; } .folha { border-radius: 20px; } }
.folha h3 { margin: 0; font-size: 1.15rem; }
.folha label { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.folha input, .folha select { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); font-size: 1rem; color: var(--ink); width: 100%; }
.folha .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.folha .marcar { flex-direction: row; align-items: center; gap: 10px; color: var(--ink); font-size: .95rem; font-weight: 500; }
.folha .marcar input { width: 22px; height: 22px; flex: none; }
.folha .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.folha .erro { color: var(--danger); margin: 0; font-size: .88rem; font-weight: 600; }
.aviso { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; z-index: 40; max-width: 90%; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .linha { transition: background-color .15s ease; } }
</style>
</head>
<body>
<div class="casca">
  <header class="topo">
    <div class="topo-in">
      <div class="marca" aria-label="Evoruk">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#FFE45C"/><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#0E5E63" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Evoruk</span>
      </div>
      <div class="periodo">
        <button type="button" class="seta" id="ant" aria-label="Anterior">‹</button>
        <h1 id="titulo">…</h1>
        <button type="button" class="seta" id="prox" aria-label="Próximo">›</button>
      </div>
    </div>
  </header>
  <div class="corpo">
    <nav class="abas" aria-label="Seções">
      <button type="button" data-aba="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>Mês</button>
      <button type="button" data-aba="ano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ano</button>
      <button type="button" data-aba="cartoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Cartões</button>
      <button type="button" data-aba="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Backup</button>
    </nav>
    <main id="tela"><p class="nota">Abrindo…</p></main>
  </div>
</div>
<div class="fundo" id="fundo" hidden><form class="folha" id="folha" autocomplete="off" novalidate></form></div>
<div class="aviso" id="aviso" role="status" hidden></div>
<input type="file" id="arquivo" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const APP = 'evoruk', VERSAO = 1;
const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CORES_PAGO = { amarelo: ['Amarelo', '#FFE45C'], verde: ['Verde', '#A6EBB4'], azul: ['Azul', '#A9D2FF'], rosa: ['Rosa', '#FFC0DA'] };
const CORES_CARTAO = ['#0E5E63','#8A05BE','#FF7A00','#1E88E5','#E53935','#11A35B','#A64AC9','#546E7A','#1A237E','#C2185B'];
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const $ = (id) => document.getElementById(id);
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
function svg(tag, attrs, ...kids) { const e = document.createElementNS(SVG_NS, tag); for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v); kids.forEach((c) => c != null && e.append(c)); return e; }
const icone = (d) => { const s = svg('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2.6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }); s.append(svg('path', { d })); return s; };
const ICO_CHECK = 'M5 12.5l4.5 4.5L19 7.5', ICO_LAPIS = 'M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4';
const novoId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const chave = (a, m) => a + '-' + String(m).padStart(2, '0');
const somaMes = (a, m, n) => { const t = a * 12 + (m - 1) + n; return [Math.floor(t / 12), (t % 12) + 1]; };
const r2 = (v) => Math.round(v * 100) / 100;
const copia = (x) => JSON.parse(JSON.stringify(x));
function dinheiro(txt) { let s = String(txt).trim().replace(/[R$\s]/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const v = Number(s); return Number.isFinite(v) ? r2(v) : NaN; }
const paraCampo = (v) => (v == null ? '' : String(v).replace('.', ','));

/* ---------------- armazenamento no aparelho (IndexedDB, com localStorage de reserva) ---------------- */
const IDB = {
  db: null,
  abrir() { return this.db || (this.db = new Promise((ok, erro) => { const r = indexedDB.open(APP, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); })); },
  async ler(k) { const db = await this.abrir(); return new Promise((ok, erro) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => erro(q.error); }); },
  async gravar(k, v) { const db = await this.abrir(); return new Promise((ok, erro) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => ok(); t.onerror = () => erro(t.error); }); },
};
const LS = APP + '-dados-v1';
async function carregar() {
  try { const v = await IDB.ler('dados'); if (v) return v; } catch (e) {}
  try { const s = localStorage.getItem(LS); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
let gravando = null, pendente = false;
function salvar() {
  pendente = true;
  if (gravando) return;
  gravando = setTimeout(async () => {
    gravando = null; pendente = false;
    const v = copia(dados);
    try { await IDB.gravar('dados', v); } catch (e) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e2) { avisa('Não consegui guardar neste aparelho. Faça um backup agora.'); } }
  }, 250);
}
window.addEventListener('pagehide', () => { if (pendente) { try { localStorage.setItem(LS, JSON.stringify(dados)); } catch (e) {} } });

    el('div', { class: 'cores', role: 'group', 'aria-label': 'Cor da conta paga' }, ...Object.entries(CORES_PAGO).map(([k, [r, cor]]) =>
      el('button', { type: 'button', class: 'cor', 'aria-pressed': String((dados.config.corPago || 'amarelo') === k), onclick: () => { dados.config.corPago = k; salvar(); desenha(); } }, el('i', { style: 'background:' + cor }), r)))));
  out.push(el('section', { class: 'card bloco' }, el('h2', { text: 'Apagar tudo' }),
    el('p', { class: 'nota', text: 'Remove todas as contas, compras e cartões deste aparelho. Salve um backup antes.' }),
    el('div', { class: 'acoes' }, el('button', { type: 'button', class: 'btn perigo', text: 'Apagar todos os dados', onclick: () => confirma('Apagar todos os dados?', 'Isso não tem volta, a não ser que você tenha um backup.', 'Apagar tudo', () => { const cor = dados.config.corPago; dados = dadosVazios(); dados.config.corPago = cor; salvar(); desenha(); avisa('Dados apagados.'); }) }))));
  return out;
}
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
async function ofereceArquivo(nome, texto, tipo) {
  const blob = new Blob([texto], { type: tipo });
  try {
    const f = new File([blob], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [f] }) && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [f], title: nome }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const url = URL.createObjectURL(blob); const a = el('a', { href: url, download: nome }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch (e) { ui.saida = texto; desenha(); return false; }
}
async function salvarBackup() {
  const ok = await ofereceArquivo('evoruk-backup-' + hojeISO() + '.json', JSON.stringify(Object.assign(copia(dados), { app: APP, versao: VERSAO, exportado: new Date().toISOString() })), 'application/json');
  if (ok) { dados.config.ultimoBackup = new Date().toISOString(); ui.saida = ''; salvar(); desenha(); avisa('Backup salvo.'); }
}
function salvarCSV() {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = ['Ano;Mês;Tipo;Nome;Valor;Situação;Vencimento'];
  Object.keys(dados.meses).sort().forEach((k) => { const d = dados.meses[k]; d.contas.forEach((c) => rows.push([d.ano, NOMES_MES[d.mes - 1], c.cartao ? 'Cartão' : 'Conta', q(c.nome), c.valor.toFixed(2).replace('.', ','), c.pago ? 'Pago' : 'A pagar', diaDe(c) || ''].join(';')));
    d.compras.forEach((p) => rows.push([d.ano, NOMES_MES[d.mes - 1], 'Compra no cartão', q(nomeCartao(p.cartao) + ': ' + p.desc + (p.parcela ? ' (' + p.parcela + ')' : '')), p.valor.toFixed(2).replace('.', ','), '', ''].join(';'))); });
  ofereceArquivo('evoruk-planilha-' + hojeISO() + '.csv', '﻿' + rows.join('\r\n'), 'text/csv');
}
$('arquivo').addEventListener('change', async () => {
  const f = $('arquivo').files[0]; if (!f) return;
  try {
    const texto = f.text ? await f.text() : await new Promise((ok, erro) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => erro(r.error); r.readAsText(f); });
    const j = JSON.parse(texto);
    if (!j || typeof j !== 'object' || !j.meses) throw new Error('formato');
    ui.importar = normaliza(j); ui.aba = 'backup'; desenha();
  } catch (e) { ui.importar = null; avisa('Não reconheci este arquivo. Escolha um backup .json do Evoruk.'); }
});
function aplicaImport(como) {
  const b = ui.importar; if (!b) return;
  if (como === 'substituir') { const cor = dados.config.corPago; dados = b; dados.config.corPago = b.config.corPago || cor; }
  else {
    b.cartoes.forEach((c) => { if (!dados.cartoes.some((x) => x.id === c.id || x.nome.toLowerCase() === c.nome.toLowerCase())) dados.cartoes.push(c); });
    const mapa = {}; b.cartoes.forEach((c) => { const x = dados.cartoes.find((y) => y.id === c.id || y.nome.toLowerCase() === c.nome.toLowerCase()); mapa[c.id] = x ? x.id : c.id; });
    for (const [k, m] of Object.entries(b.meses)) {
      m.contas.forEach((c) => { if (c.cartao) c.cartao = mapa[c.cartao] || c.cartao; }); m.compras.forEach((p) => { p.cartao = mapa[p.cartao] || p.cartao; });
      const atual = dados.meses[k];
      if (!atual) { dados.meses[k] = m; continue; }
      m.contas.forEach((c) => { if (!atual.contas.some((x) => x.id === c.id || (c.cartao ? x.cartao === c.cartao : (!x.cartao && x.nome.toLowerCase() === c.nome.toLowerCase())))) atual.contas.push(c); });
      m.compras.forEach((p) => { if (!atual.compras.some((x) => x.id === p.id || (x.cartao === p.cartao && x.desc === p.desc && x.valor === p.valor))) atual.compras.push(p); });
      atual.iniciado = atual.iniciado || m.iniciado; acertaFaturas(atual);
    }
  }
  ui.importar = null; salvar();
  const ks = Object.keys(dados.meses).sort(); const kh = chave(hoje.getFullYear(), hoje.getMonth() + 1);
  if (ks.length && !dados.meses[kh]) { const ult = ks[ks.length - 1]; if (ult < kh) { ui.ano = +ult.slice(0, 4); ui.mes = +ult.slice(5); } }
  ui.aba = 'mes'; desenha(); avisa(como === 'substituir' ? 'Backup restaurado.' : 'Dados juntados.');
}

/* ---------------- navegação ---------------- */
document.querySelectorAll('.abas button').forEach((b) => b.addEventListener('click', () => { ui.aba = b.dataset.aba; desenha(); scrollTo(0, 0); }));
$('ant').addEventListener('click', () => { if (ui.aba === 'mes') [ui.ano, ui.mes] = somaMes(ui.ano, ui.mes, -1); else ui.ano--; desenha(); });
$('prox').addEventListener('click', () => { if (ui.aba === 'mes') [ui.ano, ui.mes] = somaMes(ui.ano, ui.mes, 1); else ui.ano++; desenha(); });
document.addEventListener('keydown', (e) => {
  if (!$('fundo').hidden || /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
  if (e.key === 'ArrowLeft') $('ant').click(); else if (e.key === 'ArrowRight') $('prox').click();
});

(async () => {
  dados = normaliza(await carregar());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  desenha();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__evoruk = { get dados() { return dados; }, ui };
})();
</script>
